# Weekly updates for the pinned supply chains, as in Findling: the action SHAs,
# the base image digests of the Dockerfile, the uv lock file and the two npm
# trees (php/ for the browser bundle, ci/playwright/ for the end-to-end tests).
# Minor and patch updates arrive grouped, majors one by one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    # The Dockerfile and the uv lock file live in the backend half.
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: uv
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/php"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    # vite stays on the major nextcloud/server and @nextcloud/vite-config use
    # (7.x); a major jump breaks the bundle config (RESEARCH pitfall E).
    ignore:
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/ci/playwright"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
