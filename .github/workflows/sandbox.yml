name: Sandbox and network proof

# The container proofs of phase 2 (SAFE-01, SAFE-04, RES-02): the test stage of
# the real image, the server as PID 1 behind the production entrypoint with
# canary secrets, --network none, and a second run on the bridge network under
# a host capture that has to stay empty. Docker is not used on the development
# machine, so this is the only place these proofs run.
#
# A workflow of its own because docker.yml builds on main and release tags only.
# The test stage is built locally (push: false, load: true) and never reaches a
# registry. Models come from ci/fetch_models.py with fixed hashes into the
# runner cache and are mounted read only (D-02-09: models only in the CI cache).
# The real public documents of plan 02-24 come the same way from
# ci/fetch_corpus.py; they and the DOCX and ODT made from them are mounted read
# only and never uploaded (test corpora never leave the runner).
# Nothing here lets an empty or failing run pass: no swallowed exit code, no
# step allowed to fail, no pass for "no tests collected" (tests/test_workflows.py).
on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-suite:
    name: Container suite ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # 120 and not 60 since plan 02-24: the PDF import of the real corpus and
    # sixteen product runs of it come on top of the container proofs.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CANARY_SECRET: canary-app-${{ github.run_id }}
      CANARY_HP: canary-hp-${{ github.run_id }}
      CANARY_KEY: canary-key-${{ github.run_id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The run only reads the tree; no token stays in .git/config.
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test stage locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          # Never pushed: the test stage carries the dev group and the tests.
          target: test
          push: false
          load: true
          tags: pii-sandbox:test

      - name: Restore the models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci/out/models
          key: models-${{ hashFiles('ci/fetch_models.py') }}

      - name: Fetch the models with fixed hashes
        if: steps.models.outputs.cache-hit != 'true'
        run: python3 ci/fetch_models.py ci/out/models

      # The real corpus of plan 02-24 (owner 28.11.2026: the address space cap
      # of soffice comes from real public documents): ten files with fixed URL,
      # size and sha256 into the runner cache, never into the repository, the
      # image or an artifact. The script runs on every run, so a cached file is
      # hashed again each time. The licence of the three PDFs is not settled:
      # runtime download only, never distributed (ci/fetch_corpus.py).
      - name: Restore the real corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci/out/real-corpus
          key: real-corpus-${{ hashFiles('ci/fetch_corpus.py') }}

      - name: Fetch the real corpus with fixed hashes
        run: |
          python3 ci/fetch_corpus.py ci/out/real-corpus
          test -f ci/out/real-corpus/manifest.json
          echo "REAL_CORPUS=${GITHUB_WORKSPACE}/ci/out/real-corpus" >> "${GITHUB_ENV}"

      # Step 2 of plan 02-24: the three PDFs as DOCX and ODT, made by the
      # LibreOffice of the test image outside the sandbox (a foreign tool, not
      # the code under test: ci/convert_corpus.py) in a throwaway container
      # without network. The files stay in RUNNER_TEMP and are never uploaded;
      # a failed conversion is written down and fails test_container_corpus.py.
      - name: Convert the PDFs of the real corpus outside the sandbox
        run: |
          derived="${RUNNER_TEMP}/real-derived"
          sudo install -d -o 10001 -g 10001 -m 0755 "${derived}"
          docker run --rm --network none --user 10001:10001 --entrypoint /app/.venv/bin/python \
            -v "${REAL_CORPUS}:/real-corpus:ro" -v "${derived}:/real-derived" \
            -v "${GITHUB_WORKSPACE}/ci/convert_corpus.py:/opt/convert_corpus.py:ro" \
            pii-sandbox:test -I /opt/convert_corpus.py /real-corpus /real-derived
          test -f "${derived}/manifest.json"
          echo "REAL_DERIVED=${derived}" >> "${GITHUB_ENV}"

      # The soffice diagnosis of quick 261128-qaa (owner 28.11.2026): the images
      # of every derived file counted and sized, and copies of the 1800107
      # conversions with 1x1 images (ci/soffice_diag.py), in a throwaway
      # container without network. Both architectures, since it takes seconds;
      # the soffice runs of the diagnosis are amd64 only (job budget, see
      # tests/test_container_soffice_diag.py). The folder stays in RUNNER_TEMP
      # and is never uploaded.
      - name: Inventory the images of the derived files and make the tiny copies
        run: |
          diag="${RUNNER_TEMP}/real-diag"
          sudo install -d -o 10001 -g 10001 -m 0755 "${diag}"
          docker run --rm --network none --user 10001:10001 --entrypoint /app/.venv/bin/python \
            -v "${REAL_DERIVED}:/real-derived:ro" -v "${diag}:/real-diag" \
            -v "${GITHUB_WORKSPACE}/ci/soffice_diag.py:/opt/soffice_diag.py:ro" \
            pii-sandbox:test -I /opt/soffice_diag.py /real-derived /real-diag
          test -f "${diag}/manifest.json"
          echo "REAL_DIAG=${diag}" >> "${GITHUB_ENV}"

      # HaRP mounts the FRP client certificate at /certs/frp; here the three
      # files are canaries with the rights HaRP gives them (uid 10001, 0600).
      - name: Prepare the canary certificate folder
        run: |
          certs="${RUNNER_TEMP}/certs/frp"
          sudo install -d -o 10001 -g 10001 -m 0700 "${certs}"
          for name in client.key client.crt ca.crt; do
            printf '%s\n' "${CANARY_KEY}" | sudo tee "${certs}/${name}" > /dev/null
            sudo chown 10001:10001 "${certs}/${name}"
            sudo chmod 0600 "${certs}/${name}"
          done
          echo "CERTS=${certs}" >> "${GITHUB_ENV}"

      # The test stage carries no ci/, so the attack corpus of plan 02-07 is
      # made here (standard library only) and mounted read only; the jail and
      # corpus tests of plan 02-21 read it through PII_CORPUS.
      - name: Make the attack corpus
        run: |
          python3 ci/make_corpus.py "${RUNNER_TEMP}/corpus"
          test -f "${RUNNER_TEMP}/corpus/manifest.json"
          echo "CORPUS=${RUNNER_TEMP}/corpus" >> "${GITHUB_ENV}"

      - name: Start the server as PID 1 without a network
        run: |
          docker run -d --name sbx --network none \
            -e APP_ID=pii_redaction_backend -e APP_SECRET="${CANARY_SECRET}" -e APP_PORT=10035 \
            -e APP_HOST=0.0.0.0 -e APP_VERSION=0.0.0 -e NEXTCLOUD_URL=http://127.0.0.1:8080 \
            -e APP_PERSISTENT_STORAGE=/nc_app_pii_redaction_backend_data \
            -e HP_SHARED_KEY="${CANARY_HP}" -e HP_FRP_ADDRESS=127.0.0.1 -e HP_FRP_PORT=8782 \
            -v "${CERTS}:/certs/frp:ro" -v "${GITHUB_WORKSPACE}/ci/out/models:/models:ro" \
            -v "${CORPUS}:/corpus:ro" \
            -v "${REAL_CORPUS}:/real-corpus:ro" -v "${REAL_DERIVED}:/real-derived:ro" \
            -v "${REAL_DIAG}:/real-diag:ro" \
            pii-sandbox:test
          answer=""
          for _ in $(seq 60); do
            answer=$(docker exec sbx curl -sf --unix-socket /tmp/exapp.sock http://localhost/heartbeat || echo "")
            [ -n "${answer}" ] && break
            sleep 1
          done
          echo "heartbeat '${answer}'"
          test "${answer}" = '{"status":"ok"}'
          # The server itself is PID 1 (start.sh ends in exec); no init in between.
          docker exec sbx cat /proc/1/cmdline | tr '\0' ' ' | grep -q 'pii_redaction_backend.main'

      - name: Run the container tests
        run: |
          docker exec -e PII_IN_CONTAINER=1 -e PII_CANARY_SECRET="${CANARY_SECRET}" -e PII_CANARY_HP="${CANARY_HP}" -e PII_CANARY_KEY="${CANARY_KEY}" -e PII_MODELS=/models -e PII_CORPUS=/corpus -e PII_REAL_DIAG=/real-diag -e PII_REAL_CORPUS=/real-corpus -e PII_REAL_DERIVED=/real-derived sbx /app/.venv/bin/python -m pytest -q -rs -p no:cacheprovider -m container /app/tests

      # Read only, for the soffice diagnosis of plan 02-16: Landlock writes a
      # denial to the kernel audit only from ABI 7 (Linux 6.15) on and only
      # with audit switched on; the container test prints the ABI it sees
      # (LANDLOCK-ABI). Here the runner kernel, its LSM list and its log lines
      # that name Landlock, audit, AppArmor or LibreOffice.
      - name: Kernel facts for the soffice diagnosis
        if: always()
        run: |
          echo "kernel $(uname -r)"
          if sudo test -r /sys/kernel/security/lsm; then
            echo "lsm $(sudo cat /sys/kernel/security/lsm)"
          fi
          sudo dmesg | awk 'tolower($0) ~ /landlock|audit|apparmor|soffice|oosplash/' | tail -n 40

      - name: Start the bridge container
        run: |
          docker run -d --name sbx-bridge --dns 192.0.2.1 \
            -e APP_ID=pii_redaction_backend -e APP_SECRET="${CANARY_SECRET}" -e APP_PORT=10035 \
            -e APP_HOST=0.0.0.0 -e APP_VERSION=0.0.0 -e NEXTCLOUD_URL=http://127.0.0.1:8080 \
            -e APP_PERSISTENT_STORAGE=/nc_app_pii_redaction_backend_data \
            -e HP_SHARED_KEY="${CANARY_HP}" -e HP_FRP_ADDRESS=127.0.0.1 -e HP_FRP_PORT=8782 \
            -v "${CERTS}:/certs/frp:ro" -v "${GITHUB_WORKSPACE}/ci/out/models:/models:ro" \
            -v "${CORPUS}:/corpus:ro" \
            pii-sandbox:test
          ip=$(docker inspect --format '{{.NetworkSettings.IPAddress}}' sbx-bridge)
          test -n "${ip}"
          echo "BRIDGE_IP=${ip}" >> "${GITHUB_ENV}"
          answer=""
          for _ in $(seq 60); do
            answer=$(docker exec sbx-bridge curl -sf --unix-socket /tmp/exapp.sock http://localhost/heartbeat || echo "")
            [ -n "${answer}" ] && break
            sleep 1
          done
          test "${answer}" = '{"status":"ok"}'

      # Owner request "Netzwerkmitschnitt" (D-02-06): every packet of the
      # container address on docker0 except ARP is a finding.
      - name: Run the bridge test under a host capture
        run: |
          sudo tcpdump -i docker0 -nn -U -w "${RUNNER_TEMP}/capture.pcap" "host ${BRIDGE_IP} and not arp" &
          capture=$!
          sleep 2
          if docker exec sbx-bridge test -f /app/tests/test_lo_network.py; then
            docker exec -e PII_IN_CONTAINER=1 -e PII_MODELS=/models -e PII_CORPUS=/corpus sbx-bridge /app/.venv/bin/python -m pytest -q -rs -p no:cacheprovider -m container -k bridge /app/tests/test_lo_network.py
          else
            echo "::notice::bridge test absent, smoke only"
            docker exec -e PII_IN_CONTAINER=1 -e PII_CANARY_SECRET="${CANARY_SECRET}" sbx-bridge /app/.venv/bin/python -m pytest -q -rs -p no:cacheprovider -m container /app/tests/test_container_smoke.py
          fi
          sleep 2
          sudo kill -INT "${capture}"
          wait "${capture}" || echo "tcpdump ended with $?"
          packets=$(sudo tcpdump -nn -r "${RUNNER_TEMP}/capture.pcap" | wc -l)
          echo "packets of ${BRIDGE_IP} on docker0 besides ARP: ${packets}"
          if [ "${packets}" -ne 0 ]; then
            sudo tcpdump -nn -r "${RUNNER_TEMP}/capture.pcap" | head -n 50
          fi
          test "${packets}" -eq 0

      - name: Collect the measurements
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/measurements"
          if docker exec sbx test -f /app/tests/out/measurements.json; then
            docker cp sbx:/app/tests/out/measurements.json "${RUNNER_TEMP}/measurements/measurements.json"
          else
            echo "::notice::no measurements written"
          fi

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-measurements-${{ matrix.arch }}
          path: ${{ runner.temp }}/measurements/
          if-no-files-found: warn
          retention-days: 14

      # Step 4 of plan 02-24 for this architecture alone: the cap its values
      # would give, every value in the log. The value in sandbox/profiles.py
      # comes from both architectures together (ci/soffice_cap.py on the merged
      # 02-MEASUREMENTS.json), after the owner has seen them.
      - name: Derive the soffice cap of this architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 ci/soffice_cap.py --arch "${ARCH}" "${RUNNER_TEMP}/measurements/measurements.json"

      - name: Container logs and cleanup
        if: always()
        run: |
          for name in sbx sbx-bridge; do
            if docker inspect "${name}" > /dev/null 2>&1; then
              echo "::group::${name} state"
              docker inspect --format '{{.State.Status}} exit {{.State.ExitCode}}' "${name}"
              echo "::endgroup::"
              docker rm -f "${name}" > /dev/null
            fi
          done
