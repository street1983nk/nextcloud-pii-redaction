name: Store submission

# Submits the signed archives of one GitHub release to the Nextcloud App Store:
# both halves, the PHP app pii_redaction and the External App
# pii_redaction_backend (Findling pair pattern). By hand only
# (workflow_dispatch): a store release is a decision, not a side effect of a
# push.
#
# Lessons that are enforced here, not only written down:
#   - the container image belongs to the BACKEND id: the image of the tag must
#     exist as ghcr.io/<owner>/pii_redaction_backend and be pullable WITHOUT
#     credentials before the store knows the release, otherwise every
#     installation fails on the pull (checked below, anonymously)
#   - the release assets of BOTH halves must exist (release.yml runs only
#     after a green HEAD and builds the pair)
#   - no polling here: check the store API afterwards at most every 10 minutes
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose assets are submitted, for example v0.1.0'
        required: true
        type: string
      register:
        description: 'Register both app ids first (only for the very first submission)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: store-submit
  cancel-in-progress: false

env:
  PHP_APP: pii_redaction
  BACKEND_APP: pii_redaction_backend
  IMAGE: ghcr.io/street1983nk/pii_redaction_backend

jobs:
  submit:
    name: Check image and assets, then submit both halves
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse to run outside this repository and on a malformed tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REPOSITORY}" != "street1983nk/nextcloud-pii-redaction" ]; then
            echo "this workflow submits with the store token of street1983nk/nextcloud-pii-redaction only"
            exit 1
          fi
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag '${TAG}' is not vMAJOR.MINOR.PATCH"; exit 1; }

      - name: The backend image of the tag exists on ghcr.io and pulls without credentials
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          if ! docker buildx imagetools inspect "${IMAGE}:${version}" | tee manifest.txt; then
            echo "${IMAGE}:${version} cannot be read anonymously: not built yet, or the package is still private"
            exit 1
          fi
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt

      - name: The release assets of both halves exist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for app in "${PHP_APP}" "${BACKEND_APP}"; do
            curl -sfIL "${base}/${app}.tar.gz" > /dev/null || { echo "${app}.tar.gz is missing on ${TAG}"; exit 1; }
            curl -sfL "${base}/${app}.tar.gz.sig" -o "${RUNNER_TEMP}/${app}.signature"
            test -s "${RUNNER_TEMP}/${app}.signature" || { echo "${app}.tar.gz.sig of ${TAG} is empty or missing"; exit 1; }
          done

      - name: Register both app ids
        if: inputs.register
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          BACKEND_PRIVATE_KEY: ${{ secrets.BACKEND_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          register() {
            app="$1"
            key_var="$2"
            test -n "${!key_var}" || { echo "${key_var} is empty; the secret is missing"; exit 1; }
            ( umask 077; printf '%s\n' "${!key_var}" | tr -d '\r' > "${RUNNER_TEMP}/${app}.key" )
            curl -sfL "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${app}/${app}.crt" \
              -o "${RUNNER_TEMP}/${app}.crt"
            signature=$(printf '%s' "${app}" | openssl dgst -sha512 -sign "${RUNNER_TEMP}/${app}.key" | openssl base64 -A)
            code=$(jq -n --rawfile certificate "${RUNNER_TEMP}/${app}.crt" --arg signature "${signature}" \
                     '{certificate: $certificate, signature: $signature}' \
                   | curl -s -o "${RUNNER_TEMP}/${app}.register.json" -w '%{http_code}' \
                       -X POST 'https://apps.nextcloud.com/api/v1/apps' \
                       -H "Authorization: Token ${APPSTORE_TOKEN}" \
                       -H 'Content-Type: application/json' \
                       --data @-)
            echo "register ${app}: HTTP ${code}"; cat "${RUNNER_TEMP}/${app}.register.json"; echo
            case "${code}" in
              200|201) echo "${app} is registered" ;;
              400) echo "${app}: 400 is also the answer for an id that is registered already; the release step settles it" ;;
              *) echo "${app}: unexpected answer"; exit 1 ;;
            esac
          }
          register "${PHP_APP}" APP_PRIVATE_KEY
          register "${BACKEND_APP}" BACKEND_PRIVATE_KEY

      - name: Submit both releases
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          submit() {
            app="$1"
            download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${app}.tar.gz"
            code=$(jq -n --arg download "${download}" --rawfile signature "${RUNNER_TEMP}/${app}.signature" \
                     '{download: $download, signature: ($signature | rtrimstr("\n"))}' \
                   | curl -s -o "${RUNNER_TEMP}/${app}.release.json" -w '%{http_code}' \
                       -X POST 'https://apps.nextcloud.com/api/v1/apps/releases' \
                       -H "Authorization: Token ${APPSTORE_TOKEN}" \
                       -H 'Content-Type: application/json' \
                       --data @-)
            echo "release ${app} ${TAG}: HTTP ${code}"; cat "${RUNNER_TEMP}/${app}.release.json"; echo
            case "${code}" in
              200|201) echo "${app} ${TAG} is submitted; check https://apps.nextcloud.com/api/v1/apps.json at most every 10 minutes" ;;
              *) echo "${app}: the submission failed"; exit 1 ;;
            esac
          }
          submit "${PHP_APP}"
          submit "${BACKEND_APP}"

      - name: Remove the key files
        if: always()
        run: rm -f "${RUNNER_TEMP}/${PHP_APP}.key" "${RUNNER_TEMP}/${BACKEND_APP}.key"
