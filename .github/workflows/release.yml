name: Release archives for the app store

# One run produces everything the store submission needs, for both apps of
# this repository at once (plan 01-18, AVS plan 01-10): the staged directory,
# the store validation path over the info.xml that really ships, both size
# limits, the code signature inside the PHP app archive, the tarballs and the
# release signature over each of them, verified against the certificate of
# its app. Taken over from AVS release.yml, which took it from Findling.
#
#   pii_redaction          php/ with its built bundle, code signed and release
#                          signed with APP_PRIVATE_KEY, pin CERT_PUBKEY_SHA256
#   pii_redaction_backend  backend/appinfo/info.xml byte for byte (with its
#                          empty routes element), release signed with
#                          BACKEND_PRIVATE_KEY, pin BACKEND_CERT_PUBKEY_SHA256
#
# Release flow (SKELETON.md): tag only after HEAD is green
# (scripts/ci/head_green.sh <sha>); this run publishes the GitHub release; the
# store submission is store-submit.yml by hand, after the image of the tag exists
# on ghcr.io. No store upload in phase 1.
#
# There is no pull_request trigger, and that absence is the primary defence of
# the signing keys: a fork workflow can never reach the secrets.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub release with both archives (leave off for a rehearsal)'
        type: boolean
        default: false

permissions:
  contents: read

# No cancel-in-progress: a cancelled run is a run interrupted somewhere between
# writing a signing key to disk and deleting it again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The appstore commit whose pre-info.xslt and info.xsd the store validates with.
  APPSTORE_SHA: eda850ba61407c6e4da3e23316614c6126406652
  # The branch whose occ code signs the PHP app.
  SERVER_VERSION: stable34
  # Test-only password of the throwaway instance that occ needs for signing.
  ADMIN_PASS: 'pii-release-admin-2026-11'
  ARCHIVE_MAX_BYTES: 20971520
  INFO_XML_MAX_BYTES: 524288
  # sha256 over the DER public key of each app certificate. The PHP app: recorded
  # when its certificate request was merged (05.11.2026). The backend: its
  # certificate request (app-certificate-requests PR 1419) is still open, so the
  # value stays pending-certificate and the backend half of this run stops with
  # a sentence until the owner records the pin and the secret. The pin computed
  # locally from the backend key is
  # 7a8c64ae174d6d7aebf968519725989c5a8672d4abb54eb4366887a980ab6d4d; check it
  # against the certificate once #1419 is issued, and only then write it here.
  CERT_PUBKEY_SHA256: 4f61842edfb06ad0f8ea480d618e8d17c17dde779bcadf496a73def1e78fff22
  BACKEND_CERT_PUBKEY_SHA256: pending-certificate

jobs:
  archives:
    name: Build, sign and size check both archives
    runs-on: ubuntu-24.04
    # An estimate until the first run measures it: the server checkout with
    # submodules, a throwaway install for occ, the bundle build, two archives.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      # The repository first, the server into a subdirectory afterwards:
      # actions/checkout empties its target.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out nextcloud/server for its occ
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ env.SERVER_VERSION }}
          submodules: recursive
          path: server
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_sqlite, gd, zip, openssl
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install xsltproc and xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xsltproc libxml2-utils

      - name: Refuse to sign anything outside a tag or a manual run of this repository
        run: |
          if [ "${GITHUB_REPOSITORY}" != "street1983nk/nextcloud-pii-redaction" ]; then
            echo "this workflow signs with the release keys of street1983nk/nextcloud-pii-redaction only"
            exit 1
          fi
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            push:refs/tags/v*) echo "a release tag, signing is in scope" ;;
            workflow_dispatch:*) echo "a manual run, which needs write access and cannot come from a fork" ;;
            *) echo "unexpected event ${GITHUB_EVENT_NAME} on ${GITHUB_REF}"; exit 1 ;;
          esac

      - name: No skeleton placeholder may ship
        run: |
          if grep -rn 'TODO(skeleton)' php/appinfo php/l10n backend/appinfo README.md README.en.md README.fr.md docs; then
            echo "the lines above still carry a skeleton placeholder"
            exit 1
          fi
          echo "no placeholder in the shipped or public texts"

      # Lockstep (owner rule 06.11.): exact at build time. This workflow builds
      # the files the store downloads, so it checks instead of trusting another
      # workflow.
      - name: On a tag, the tag, both info.xml versions and the image tag have to agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          php_version=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' php/appinfo/info.xml | head -n 1)
          backend_version=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' backend/appinfo/info.xml | head -n 1)
          image_tag=$(sed -n 's:.*<image-tag>\([^<]*\)</image-tag>.*:\1:p' backend/appinfo/info.xml | head -n 1)
          echo "git tag ${tag}, php ${php_version}, backend ${backend_version}, image-tag ${image_tag}"
          fail=0
          [ "${php_version}" = "${tag}" ] || { echo "the PHP app version does not match the git tag"; fail=1; }
          [ "${backend_version}" = "${tag}" ] || { echo "the backend version does not match the git tag"; fail=1; }
          [ "${image_tag}" = "${tag}" ] || { echo "the image tag does not match the git tag"; fail=1; }
          exit "${fail}"

      - name: Fetch the pinned store transform and schema
        run: |
          base="https://raw.githubusercontent.com/nextcloud/appstore/${APPSTORE_SHA}/nextcloudappstore/api/v1/release"
          curl -fsSL "${base}/pre-info.xslt" -o "${RUNNER_TEMP}/pre-info.xslt"
          curl -fsSL "${base}/info.xsd" -o "${RUNNER_TEMP}/info.xsd"

      # occ integrity:sign-app needs an installed instance (Checker, app config,
      # database). Nothing of either archive passes through it.
      - name: Install a throwaway Nextcloud so occ can sign
        working-directory: server
        run: |
          mkdir -p data
          ./occ maintenance:install --database=sqlite --admin-user admin --admin-pass "${ADMIN_PASS}"

      # ---------------------------------------------------------------------
      # The PHP app: pii_redaction
      # ---------------------------------------------------------------------

      # The certificate is public and fetched; the pin is the sha256 over the
      # DER of its public key (the PEM text differs between OpenSSL versions,
      # the DER does not) and -nameopt RFC2253 pins the spelling of the subject.
      - name: Fetch the PHP app certificate and prove it belongs to our key
        run: |
          check() {
            curl -fsSL "https://github.com/nextcloud/app-certificate-requests/raw/master/$1/$1.crt" \
              -o "${RUNNER_TEMP}/$1.crt"
            subject=$(openssl x509 -in "${RUNNER_TEMP}/$1.crt" -noout -subject -nameopt RFC2253)
            actual=$(openssl x509 -in "${RUNNER_TEMP}/$1.crt" -noout -pubkey \
              | openssl pkey -pubin -outform DER | openssl sha256 -r | cut -d' ' -f1)
            echo "$1 subject     ${subject}"
            echo "$1 fingerprint ${actual}"
            [ "${subject}" = "subject=CN=$1" ] || { echo "$1: the certificate subject is not the app id"; exit 1; }
            [ "${actual}" = "$2" ] || { echo "$1: the certificate does not belong to the recorded key"; exit 1; }
          }
          check pii_redaction "${CERT_PUBKEY_SHA256}"

      # The file action lives in the built bundle js/pii_redaction-init.mjs
      # (Vite, @nextcloud/files 4); it is not in git. --ignore-scripts: npm ci
      # installs exactly the lock file with its integrity hashes and runs no
      # install script. stage-companion refuses a missing or empty bundle.
      - name: Build the bundle of the PHP app
        working-directory: php
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s js/pii_redaction-init.mjs

      - name: Stage the PHP app
        run: scripts/release/store-archive.sh stage-companion "${RUNNER_TEMP}/build-php"

      - name: Validate the staged PHP app info.xml the way the store does
        run: |
          xsltproc "${RUNNER_TEMP}/pre-info.xslt" "${RUNNER_TEMP}/build-php/pii_redaction/appinfo/info.xml" \
            | xmllint --noout --schema "${RUNNER_TEMP}/info.xsd" -
          bytes=$(stat -c%s "${RUNNER_TEMP}/build-php/pii_redaction/appinfo/info.xml")
          echo "info.xml is ${bytes} bytes, the store limit is ${INFO_XML_MAX_BYTES}"
          [ "${bytes}" -lt "${INFO_XML_MAX_BYTES}" ]

      # The key goes to a file under RUNNER_TEMP with umask 077, arrives through
      # the environment and never through the command line, and the last step
      # of the job deletes it. tr -d '\r': a secret stored from Windows carries
      # CRLF, and PHP's openssl cannot read such a key.
      - name: Sign the PHP app code
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "APP_PRIVATE_KEY is not set; an unsigned archive must not be built"
            exit 1
          fi
          ( umask 077; printf '%s\n' "${APP_PRIVATE_KEY}" | tr -d '\r' > "${RUNNER_TEMP}/pii_redaction.key" )
          php server/occ integrity:sign-app \
            --privateKey="${RUNNER_TEMP}/pii_redaction.key" \
            --certificate="${RUNNER_TEMP}/pii_redaction.crt" \
            --path="${RUNNER_TEMP}/build-php/pii_redaction"
          test -s "${RUNNER_TEMP}/build-php/pii_redaction/appinfo/signature.json"

      # Stage, code sign, pack, release sign: the code signature has to be
      # inside the tarball, the release signature is over it.
      - name: Pack the PHP app archive
        run: |
          scripts/release/store-archive.sh pack "${RUNNER_TEMP}/build-php" pii_redaction dist/pii_redaction.tar.gz
          bytes=$(stat -c%s dist/pii_redaction.tar.gz)
          echo "the archive is ${bytes} bytes, the store limit is ${ARCHIVE_MAX_BYTES}"
          [ "${bytes}" -lt "${ARCHIVE_MAX_BYTES}" ]

      - name: Sign the PHP app archive for the store and verify the signature
        run: |
          openssl dgst -sha512 -sign "${RUNNER_TEMP}/pii_redaction.key" dist/pii_redaction.tar.gz \
            | openssl base64 -A > dist/pii_redaction.tar.gz.sig
          test -s dist/pii_redaction.tar.gz.sig
          openssl x509 -in "${RUNNER_TEMP}/pii_redaction.crt" -noout -pubkey > "${RUNNER_TEMP}/pii_redaction.pub"
          openssl base64 -d -A -in dist/pii_redaction.tar.gz.sig -out "${RUNNER_TEMP}/pii_redaction.sig.bin"
          openssl dgst -sha512 -verify "${RUNNER_TEMP}/pii_redaction.pub" \
            -signature "${RUNNER_TEMP}/pii_redaction.sig.bin" dist/pii_redaction.tar.gz

      # ---------------------------------------------------------------------
      # The External App: pii_redaction_backend
      # ---------------------------------------------------------------------

      # Until the certificate request is merged there is no certificate to
      # fetch and no pin to compare with; the run stops here with a sentence,
      # after the PHP app was built and checked.
      - name: Fetch the backend certificate and prove it belongs to our key
        run: |
          if [ "${BACKEND_CERT_PUBKEY_SHA256}" = "pending-certificate" ]; then
            echo "BACKEND_PRIVATE_KEY is not set; the backend certificate request (app-certificate-requests PR 1419) must be merged first."
            exit 1
          fi
          check() {
            curl -fsSL "https://github.com/nextcloud/app-certificate-requests/raw/master/$1/$1.crt" \
              -o "${RUNNER_TEMP}/$1.crt"
            subject=$(openssl x509 -in "${RUNNER_TEMP}/$1.crt" -noout -subject -nameopt RFC2253)
            actual=$(openssl x509 -in "${RUNNER_TEMP}/$1.crt" -noout -pubkey \
              | openssl pkey -pubin -outform DER | openssl sha256 -r | cut -d' ' -f1)
            echo "$1 subject     ${subject}"
            echo "$1 fingerprint ${actual}"
            [ "${subject}" = "subject=CN=$1" ] || { echo "$1: the certificate subject is not the app id"; exit 1; }
            [ "${actual}" = "$2" ] || { echo "$1: the certificate does not belong to the recorded key"; exit 1; }
          }
          check pii_redaction_backend "${BACKEND_CERT_PUBKEY_SHA256}"

      # info.xml byte for byte with its empty routes element, the reason is at
      # stage_backend in scripts/release/store-archive.sh. No code signature on
      # this half: it delivers no PHP into the instance.
      - name: Stage the backend app
        run: scripts/release/store-archive.sh stage-backend "${RUNNER_TEMP}/build-backend"

      - name: Validate the staged backend info.xml the way the store does
        run: |
          xsltproc "${RUNNER_TEMP}/pre-info.xslt" "${RUNNER_TEMP}/build-backend/pii_redaction_backend/appinfo/info.xml" \
            | xmllint --noout --schema "${RUNNER_TEMP}/info.xsd" -
          bytes=$(stat -c%s "${RUNNER_TEMP}/build-backend/pii_redaction_backend/appinfo/info.xml")
          echo "info.xml is ${bytes} bytes, the store limit is ${INFO_XML_MAX_BYTES}"
          [ "${bytes}" -lt "${INFO_XML_MAX_BYTES}" ]

      - name: Pack the backend archive
        run: |
          scripts/release/store-archive.sh pack "${RUNNER_TEMP}/build-backend" pii_redaction_backend dist/pii_redaction_backend.tar.gz
          bytes=$(stat -c%s dist/pii_redaction_backend.tar.gz)
          echo "the archive is ${bytes} bytes, the store limit is ${ARCHIVE_MAX_BYTES}"
          [ "${bytes}" -lt "${ARCHIVE_MAX_BYTES}" ]

      - name: Sign the backend archive for the store and verify the signature
        env:
          BACKEND_PRIVATE_KEY: ${{ secrets.BACKEND_PRIVATE_KEY }}
        run: |
          if [ -z "${BACKEND_PRIVATE_KEY}" ]; then
            echo "BACKEND_PRIVATE_KEY is not set; the backend certificate request (app-certificate-requests PR 1419) must be merged first."
            exit 1
          fi
          ( umask 077; printf '%s\n' "${BACKEND_PRIVATE_KEY}" | tr -d '\r' > "${RUNNER_TEMP}/pii_redaction_backend.key" )
          openssl dgst -sha512 -sign "${RUNNER_TEMP}/pii_redaction_backend.key" dist/pii_redaction_backend.tar.gz \
            | openssl base64 -A > dist/pii_redaction_backend.tar.gz.sig
          test -s dist/pii_redaction_backend.tar.gz.sig
          openssl x509 -in "${RUNNER_TEMP}/pii_redaction_backend.crt" -noout -pubkey > "${RUNNER_TEMP}/pii_redaction_backend.pub"
          openssl base64 -d -A -in dist/pii_redaction_backend.tar.gz.sig -out "${RUNNER_TEMP}/pii_redaction_backend.sig.bin"
          openssl dgst -sha512 -verify "${RUNNER_TEMP}/pii_redaction_backend.pub" \
            -signature "${RUNNER_TEMP}/pii_redaction_backend.sig.bin" dist/pii_redaction_backend.tar.gz

      # ---------------------------------------------------------------------
      # What is in the two files, asserted rather than described
      # ---------------------------------------------------------------------

      - name: Prove what the archives contain and what they do not
        run: |
          fail=0
          for pair in "pii_redaction:1" "pii_redaction_backend:0"; do
            app="${pair%:*}"
            wants_signature="${pair#*:}"
            archive="dist/${app}.tar.gz"
            echo "::group::${archive}"
            scripts/release/store-archive.sh assert-contents "${archive}" "${app}" "${wants_signature}" || fail=1
            echo "::endgroup::"
            test -s "${archive}.sig" || { echo "${archive}.sig is missing or empty"; fail=1; }
          done
          exit "${fail}"

      - name: Upload both archives and their signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-release
          path: |
            dist/pii_redaction.tar.gz
            dist/pii_redaction.tar.gz.sig
            dist/pii_redaction_backend.tar.gz
            dist/pii_redaction_backend.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

      # The two .sig files travel along: a signature reveals nothing about the
      # key, and store-submit.yml reads it next to the archive it belongs to.
      - name: Publish a GitHub release with both archives
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.create_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes-file <(awk -v v="## ${GITHUB_REF#refs/tags/v}" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md) \
            dist/pii_redaction.tar.gz \
            dist/pii_redaction.tar.gz.sig \
            dist/pii_redaction_backend.tar.gz \
            dist/pii_redaction_backend.tar.gz.sig

      - name: Remove both key files
        if: always()
        run: |
          for f in "${RUNNER_TEMP}/pii_redaction.key" "${RUNNER_TEMP}/pii_redaction_backend.key"; do
            shred -u "${f}" 2>/dev/null || true
            rm -f "${f}"
            if [ -e "${f}" ]; then
              echo "${f} still exists after the deletion step"
              exit 1
            fi
          done
          echo "neither key file exists any more"
