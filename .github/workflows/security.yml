name: Security scans

# Same three scans as Findling: CodeQL over the Python, REUSE licensing lint, and
# pip-audit over the locked runtime set.
#
# The work of a phase lives on its phase branch for weeks before it reaches
# main, and no pull request is open in between: without the phase branches
# here a new dependency would be locked, built and deployed in CI without one
# audit (found on 2026-11-18).
on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  reuse:
    name: REUSE licensing lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: reuse lint
        run: uvx --from "reuse[charset-normalizer]" reuse lint

  pip-audit:
    name: pip-audit over the locked set
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pyproject.toml and uv.lock live in backend/ (the PHP half has no Python):
    # without this the export dies with "No pyproject.toml found".
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Export the locked runtime set
        run: uv export --frozen --format requirements-txt --no-emit-project --no-dev -o "${RUNNER_TEMP}/requirements-audit.txt"

      # torch comes from the PyTorch CPU index as 2.15.0+cpu; PyPI knows no local
      # version, so --strict would stop on it as "not found". The advisories name
      # the upstream release, so the audit asks for it without the +cpu tag
      # (plan 02-02, tests/test_dependencies.py).
      - name: Audit torch under its upstream version
        run: sed -i -E 's/^torch==([0-9.]+)\+cpu /torch==\1 /' "${RUNNER_TEMP}/requirements-audit.txt"

      - name: Audit against the advisory databases
        run: uvx pip-audit --strict --disable-pip -r "${RUNNER_TEMP}/requirements-audit.txt"
